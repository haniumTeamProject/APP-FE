[versions]
# AGP 8.13.0 은 최신 안정판이라 대부분의 Android Studio 가 연다.
# 9.x 는 프리뷰라 최신 스튜디오에서만 열려서 팀 공유가 안 된다.
# 세트 제약: Gradle 8.13 · JDK 17 · compileSdk 36 · Build Tools 35+.
agp = "8.13.0"
# AGP 8.x 는 Kotlin 을 내장하지 않으므로 플러그인을 직접 건다.
# 의존성이 kotlin-stdlib 2.2.x 를 끌어오므로 컴파일러도 같은 계열로 맞춘다.
# 낮추면 "incompatible metadata version" 으로 컴파일이 깨진다. AGP 8.13 은 Kotlin 2.3 까지 지원.
kotlin = "2.2.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.8.0"
constraintlayout = "2.1.4"
okhttp = "5.4.0"
gson = "2.11.0"
fragmentKtx = "1.8.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
okhttp-bom = { group = "com.squareup.okhttp3", name = "okhttp-bom", version.ref = "okhttp" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

